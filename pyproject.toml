[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hayward"
dynamic = ["version"]
description = "Static scanner for ML model files: finds code execution in PyTorch, pickle, joblib, GGUF, SafeTensors, ONNX and Keras checkpoints before you load them. Scans offline, one dependency."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Hedgerow", email = "hello@hedgerow.dev" }]
keywords = [
    "security", "security-scanner", "vulnerability-scanner",
    "machine-learning", "mlsecops", "ai-security",
    "pickle", "deserialization", "supply-chain", "malware-detection",
    "model-scanner", "pickle-scanner", "model-security", "ml-security",
    "huggingface", "pytorch", "safetensors", "gguf", "onnx", "keras",
    "torch-load", "arbitrary-code-execution",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Typing :: Typed",
]

# defusedxml is the only runtime dependency. It backs the PMML reader, where
# the entity-expansion defence is the point of the check rather than an
# implementation detail.
dependencies = ["defusedxml>=0.7,<1.0"]

[project.optional-dependencies]
# numpy and joblib let CI run the load guard's tests for those loaders. Both
# are BSD-3-Clause. torch is left out; its guard tests skip without it.
dev = [
    "pytest>=8.0,<9.0", "pytest-cov>=5.0,<8.0", "ruff>=0.4,<1.0",
    "numpy>=1.24,<3.0", "joblib>=1.2,<2.0",
]
# `hayward mcp`: the official MCP Python SDK (MIT). Optional, so the core
# install keeps its single dependency.
mcp = ["mcp>=2.3,<3"]

[project.urls]
Homepage = "https://github.com/hedgerow-dev/hayward"
Source = "https://github.com/hedgerow-dev/hayward"
Issues = "https://github.com/hedgerow-dev/hayward/issues"

[project.scripts]
hayward = "hayward.cli:main"

[project.gui-scripts]
hayward-gui = "hayward.gui:main"

# Single source of truth for the version: `__version__` in hayward/__init__.py.
[tool.hatch.version]
path = "hayward/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["hayward"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "S"]
# S301/S403 flag pickle imports. This package parses pickle streams as
# opcodes and never unpickles anything; `pickletools` is the tool for that
# job and cannot be swapped for something the linter prefers.
ignore = ["S301", "S403", "E501"]

[tool.ruff.lint.per-file-ignores]
# Tests construct deliberately unsafe fixtures. That is the fixture, not a bug.
"tests/*" = ["S", "B011"]
# Build/eval scripts run known subprocesses (the wheel build) with a fixed
# argv list and sys.executable, never shell or untrusted input. S603/S607 flag
# the subprocess call itself, which is the point of a build script.
"scripts/*" = ["S603", "S607"]
