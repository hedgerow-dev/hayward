name: CI

on:
  push:
    branches: [main]
  pull_request:

# Supersede an in-flight run for the same ref: a new push cancels the previous
# run's remaining matrix jobs instead of paying for both.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: pytest
      # The scanner reads hostile input, so a crash is a security defect and
      # not merely a failed test. This runs the CLI over the test fixtures to
      # catch anything that escapes as an unhandled exception.
      - run: hayward scan tests --fail-on never
        shell: bash
      # Coverage is measured on a single matrix entry (HW-133) so the other
      # eleven jobs stay fast. Reporting only: no failure threshold yet.
      - if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        run: |
          pip install pytest-cov
          pytest --cov=hayward --cov-report=term-missing

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
